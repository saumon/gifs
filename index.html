<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing to see</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="system.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .window.maximized {
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            left: 0 !important;
            transform: none !important;
            margin: 0;
        }

        .title-bar {
            cursor: move;
            user-select: none;
        }

        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
            z-index: 0;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            margin-bottom: 20px;
            cursor: pointer;
            pointer-events: auto;
            text-align: center;
        }

        .desktop-icon img {
            width: 32px;
            height: 32px;
            margin-bottom: 5px;
        }

        .desktop-icon span {
            background: #fff;
            padding: 2px 4px;
            border: 1px solid #000;
            font-family: 'Geneva_9', sans-serif;
            font-size: 12px;
            box-shadow: 1px 1px 0 #000;
        }

        .window {
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="desktop"></div>
    <div class="window" style="width: 300px">
        <div class="title-bar">
            <button aria-label="Close" class="close"></button>
            <h1 class="title">Alert</h1>
            <button aria-label="Resize" class="resize"></button>
        </div>
        <div class="separator"></div>
        <div class="window-pane">
            <p style="text-align: center;">nothing to see</p>
        </div>
    </div>
    <script>
        const windowEl = document.querySelector('.window');
        const closeBtn = document.querySelector('.close');
        const resizeBtn = document.querySelector('.resize');
        const titleBar = document.querySelector('.title-bar');

        closeBtn.addEventListener('click', () => {
            windowEl.style.display = 'none';
        });

        resizeBtn.addEventListener('click', () => {
            windowEl.classList.toggle('maximized');
            // Reset position if maximizing/restoring to ensure centering works again if needed
            if (!windowEl.classList.contains('maximized')) {
                // Optional: could reset to center, or keep last position. 
                // For simplicity, let's keep it where it is or reset. 
                // If we want to reset to center when restoring:
                // windowEl.style.top = '50%';
                // windowEl.style.left = '50%';
                // windowEl.style.transform = 'translate(-50%, -50%)';
                // But user might expect it to stay where they dragged it.
                // However, the CSS .window rule handles the centering if style attribute is cleared.
                // Let's leave the style attribute as is for now, it handles the dragged position.
            }
        });

        // Drag Logic
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        titleBar.addEventListener('mousedown', (e) => {
            // Prevent dragging if clicking buttons
            if (e.target.tagName === 'BUTTON') return;

            if (windowEl.classList.contains('maximized')) return;

            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;

            const rect = windowEl.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            // Switch to absolute pixel positioning to prevent jumping
            windowEl.style.transform = 'none';
            windowEl.style.left = `${initialLeft}px`;
            windowEl.style.top = `${initialTop}px`;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            windowEl.style.left = `${initialLeft + deltaX}px`;
            windowEl.style.top = `${initialTop + deltaY}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Dynamic GIF Icons
        const desktop = document.getElementById('desktop');
        const windowPane = document.querySelector('.window-pane');
        const windowTitle = document.querySelector('.title-bar .title');

        fetch('https://api.github.com/repos/saumon/gifs/contents/assets')
            .then(response => response.json())
            .then(data => {
                if (!Array.isArray(data)) return;

                data.filter(file => file.name.endsWith('.gif')).forEach(file => {
                    const icon = document.createElement('div');
                    icon.className = 'desktop-icon';
                    icon.innerHTML = `
                        <img src="icon.svg" alt="GIF">
                        <span>${file.name}</span>
                    `;

                    icon.addEventListener('click', () => {
                        windowPane.innerHTML = `<img src="${file.download_url}" style="max-width: 100%; display: block; margin: 0 auto;">`;
                        windowTitle.textContent = file.name;
                        windowEl.style.display = 'flex';
                    });

                    desktop.appendChild(icon);
                });
            })
            .catch(err => console.error('Failed to load assets:', err));
    </script>
</body>

</html>
